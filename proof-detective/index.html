<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>证明侦探 · 找漏洞</title>
<style>
/* ═══════════════════════════════════════════════
   证明侦探 v0.1（2026-08-12 教育测试原型）
   用途：牧之(14)/牧童(11) 形式化思维启蒙
   核心：证明 = 每一步都不能跳。机器验证 = 不许"显然"。
   风格：侦探档案夹 + 黑板演算。深色舞台，纸面=档案。
   ═══════════════════════════════════════════════ */
:root{
  --bg:#101418;        /* 深夜档案室 */
  --paper:#f2ead8;     /* 档案纸 */
  --ink:#1c1a16;       /* 墨 */
  --red:#b3372e;       /* 漏洞红 */
  --green:#2e7d4f;     /* 通过绿 */
  --amber:#c9920e;     /* 线索黄 */
  --chalk:#e8e4d8;     /* 黑板粉笔 */
  --board:#24303c;     /* 黑板 */
  --font:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'JetBrains Mono','Fira Code',Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden;max-width:100%}
body{
  max-width:100%;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font);
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;
  padding:24px 16px 48px;
}
/* ── 标题 ── */
.hero{text-align:center;margin-bottom:20px;color:var(--chalk)}
.hero h1{
  font-size:clamp(26px,5vw,40px);
  letter-spacing:.06em;
  font-weight:900;
}
.hero h1 span{color:var(--amber)}
.hero p{opacity:.75;margin-top:8px;font-size:clamp(13px,2.5vw,16px)}
.badge{
  display:inline-block;
  background:var(--amber);color:#1c1400;
  font-size:12px;font-weight:700;
  padding:3px 12px;border-radius:20px;
  margin-bottom:10px;letter-spacing:.12em;
}

/* ── 档案卡片 ── */
.case{
  width:min(94vw,760px);
  background:var(--paper);
  border-radius:10px;
  padding:22px 18px;
  box-shadow:0 18px 50px rgba(0,0,0,.5);
  position:relative;
}
.case::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:6px;
  background:repeating-linear-gradient(90deg,var(--red) 0 20px,transparent 20px 26px);
  border-radius:10px 10px 0 0;
}
.case-head{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:#6b5d4a;
  margin-bottom:14px;letter-spacing:.08em;
}
.case-head .no{
  background:var(--ink);color:var(--paper);
  padding:2px 10px;border-radius:4px;font-weight:700;
}
.case-head .tag{
  border:1px solid #b7a78c;padding:4px 10px;border-radius:4px;font-size:14px;
}
.question{font-size:clamp(15px,3vw,18px);line-height:1.7;font-weight:700;margin-bottom:14px}
.story{font-size:clamp(15px,3vw,17px);line-height:1.9;color:#3d3629;margin-bottom:18px}
.story b{color:var(--red)}

/* ── 黑板演算区 ── */
.board{
  overflow-x:hidden;
  overflow-wrap:break-word;
  word-break:break-word;
  background:var(--board);
  border-radius:8px;
  padding:14px 12px;
  font-family:var(--font-mono);
  color:var(--chalk);
  font-size:clamp(12px,2.2vw,15.5px);
  line-height:1.85;
  margin-bottom:18px;
  border:4px solid #4a3b2a;
  box-shadow:inset 0 0 40px rgba(0,0,0,.4);
}
.board .step{cursor:pointer;padding:4px 8px;border-radius:4px;transition:background .15s;position:relative}
.board .step:hover{background:rgba(255,255,255,.08)}
.board .step.hint-glow{background:rgba(201,146,14,.18)}
.board .step.found{background:rgba(179,55,46,.35);text-decoration:line-through wavy rgba(255,120,100,.7)}
.board .stepline{display:block;padding-left:1.1em;text-indent:-1.1em;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-all}
.board .lbl{color:#8fa3b5;margin-right:.6em}
.board .bad{color:#ff8d80}

/* ── 选项按钮 ── */
.options{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.opt{
  text-align:left;
  background:#fff;
  border:2px solid #d8cdb8;
  border-radius:8px;
  padding:14px 16px;
  min-height:48px;
  font-size:clamp(15px,2.8vw,16.5px);
  font-family:var(--font);
  color:var(--ink);
  cursor:pointer;
  transition:all .15s;
  line-height:1.6;
}
.opt:hover{border-color:var(--amber);transform:translateX(3px)}
.opt.correct{border-color:var(--green);background:#e8f5ec;font-weight:700}
.opt.wrong{border-color:var(--red);background:#fdecea}
.opt .letter{font-weight:900;margin-right:10px;color:#8a7a5e;display:inline-block;min-width:1.2em}

/* ── 反馈区 ── */
.feedback{
  min-height:0;
  border-radius:8px;
  padding:14px 16px;
  font-size:clamp(13.5px,2.6vw,15.5px);
  line-height:1.7;
  display:none;
  margin-bottom:16px;
}
.feedback.show{display:block;animation:fadeIn .3s}
.feedback.good{background:#e8f5ec;border:2px solid var(--green)}
.feedback.bad{background:#fdecea;border:2px solid var(--red)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1}}

/* ── 下一步按钮 ── */
.next{
  display:block;
  width:100%;
  background:var(--ink);color:var(--paper);
  border:none;border-radius:8px;
  padding:14px;
  font-size:16px;font-weight:700;
  font-family:var(--font);
  cursor:pointer;
  transition:all .15s;
  opacity:0;pointer-events:none;
}
.next.ready{opacity:1;pointer-events:auto}
.next:hover{background:#3a3226;transform:translateY(-1px)}

/* ── 进度点 ── */
.progress{display:flex;gap:8px;margin:18px 0 6px}
.dot{width:10px;height:10px;border-radius:50%;background:#3a4249;transition:all .3s}
.dot.done{background:var(--green)}
.dot.active{background:var(--amber);transform:scale(1.3)}

/* ── 结尾卡 ── */
.finale{display:none;text-align:center;color:var(--chalk);padding:30px 0}
.finale.show{display:block;animation:fadeIn .5s}
.finale .big{font-size:clamp(28px,6vw,48px);font-weight:900;margin-bottom:14px}
.finale .big span{color:var(--amber)}
.finale p{opacity:.85;line-height:1.9;max-width:640px;margin:0 auto 10px;font-size:clamp(14px,2.8vw,17px)}
.finale .cert{
  display:inline-block;margin-top:16px;
  border:2px solid var(--amber);color:var(--amber);
  padding:10px 26px;border-radius:8px;
  font-weight:700;letter-spacing:.15em;
  animation:glow 2s ease-in-out infinite;
}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(201,146,14,.2)}50%{box-shadow:0 0 26px rgba(201,146,14,.5)}}
.footer{color:#5a636c;font-size:12px;margin-top:22px;text-align:center;line-height:1.8}
.footer a{color:var(--amber);text-decoration:none;border-bottom:1px solid rgba(201,146,14,.4);padding-bottom:1px}
.footer a:hover{border-bottom-color:var(--amber)}
.finale .nng-link{color:var(--amber);text-decoration:none;border-bottom:1px solid rgba(201,146,14,.4);padding-bottom:1px;font-weight:700}
.finale .nng-link:hover{border-bottom-color:var(--amber)}

/* ── 窄屏微调 ── */
@media (max-width:380px){
  .board{font-size:12px;padding:12px 9px;line-height:1.8}
  .board .stepline{padding-left:1.2em;text-indent:-1.2em}
  .case{padding:20px 14px}
  .hero h1{font-size:26px}
  .question{font-size:15px}
  .story{font-size:14.5px}
  .opt{font-size:14.5px;padding:13px 14px}
}
</style>
</head>
<body>

<div class="hero">
  <div class="badge">给 10-14 岁的逻辑挑战</div>
  <h1>证明侦探<span> 🕵️</span></h1>
  <p>机器能验证的证明，每一步都不能跳。找出「偷懒的那一步」，它就是漏洞。</p>
</div>

<div class="progress" id="progress"></div>

<div class="case" id="case">
  <div class="case-head">
    <span class="no">案件 <span id="caseNo">1</span>/<span id="caseTotal">4</span></span>
    <span class="tag" id="caseTag">代数诡辩</span>
  </div>
  <div class="question" id="question"></div>
  <div class="story" id="story"></div>
  <div class="board" id="board"></div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next" id="nextBtn">下一案 →</button>
</div>

<div class="finale" id="finale">
  <div class="big">结案<span>！</span></div>
  <p>你找出了 4 个案子里所有的漏洞。现在你知道了：</p>
  <p><b>「显然」是证明里最危险的词。</b>数学家和计算机的区别是：<br>数学家会跳过「显然」的步骤，而计算机一个都不放过。</p>
  <p>这就是为什么 AI 时代，<b>会验证</b>比<b>会算</b>更重要。</p>
  <div class="cert">🎖 证明侦探</div>
  <p style="margin-top:18px;font-size:13px;opacity:.6">想继续挑战？去玩 Lean 官方入门游戏<br><a href="https://adam.math.hhu.de/" target="_blank" class="nng-link">Natural Number Game（自然数游戏）→</a></p>
</div>

<div class="footer">
  证明侦探 · 教育测试原型 v0.1（2026-08-12）· 给牧之 & 牧童
</div>

<script>
/* ═══════════════ 案件数据 ═══════════════
   每个案件：一个看似成立的证明 + 一个隐藏漏洞
   badStep 标注漏洞所在步骤（显示层用）
   正确答案是「漏洞是什么」的选项 */
const CASES = [
  {
    tag: "代数诡辩",
    question: "「证明 1 = 2」：漏洞在哪一步？",
    story: "有人在黑板上写下了这个「证明」。它一定错了，因为 1 不可能等于 2。<b>找出偷换概念的那一步</b>。",
    steps: [
      {lbl:"1", t:"设 a = b"},
      {lbl:"2", t:"两边乘 a：a² = ab"},
      {lbl:"3", t:"两边减 b²：a² − b² = ab − b²"},
      {lbl:"4", t:"因式分解：(a+b)(a−b) = b(a−b)"},
      {lbl:"5", t:"两边除以 (a−b)：\na+b = b"},
      {lbl:"6", t:"因为 a=b，所以 2b = b，所以 2 = 1（？）"}
    ],
    badStep: 4,
    hint: "第⑤步之前，先想想：a 和 b 相等的话，(a−b) 等于多少？",
    options: [
      "两边乘 a 不合法",
      "除以 (a−b)，但 a−b = 0，不能除以 0",
      "减 b² 本身合法（问题出在后面的除以 0）",
      "因式分解公式用错了"
    ],
    correct: 1,
    explain: "a = b 时 a−b = 0。<b>除以 0</b> 是数学里唯一绝对禁止的操作。前面六步全部合法，就这一步毁了整个证明。计算机验证证明时，这种「偷偷除以零」是它第一眼就能抓到的漏洞。"
  },
  {
    tag: "几何陷阱",
    question: "「所有三角形都是等腰三角形」？漏洞在哪？",
    story: "一个「著名」的伪证明：随便画一个三角形，都能「证明」它是等腰的。来看看它怎么骗人的。<b>找出那个画错的辅助线</b>。",
    steps: [
      {lbl:"1", t:"画三角形 ABC，取 BC 中点 M"},
      {lbl:"2", t:"作 ∠A 的角平分线，交 BC 于 D"},
      {lbl:"3", t:"过 D 作 AB、AC 的垂线，垂足 E、F"},
      {lbl:"4", t:"直角三角形 ADE ≅ ADF（角角边）→ AE = AF"},
      {lbl:"5", t:"直角三角形 BDE ≅ CDF（斜边直角边）→ BE = CF"},
      {lbl:"6", t:"AE+BE = AF+CF → AB = AC → 等腰！✗"}
    ],
    badStep: 2,
    hint: "∠A 的角平分线一定会和 BC 相交于中点 M 吗？",
    options: [
      "取中点 M 不合法",
      "角平分线和 BC 的交点 D，不一定在 M 上（图里 D 和 M 被画重合了）",
      "直角三角形全等判定用错了",
      "加法 AE+BE 不等于 AB"
    ],
    correct: 1,
    explain: "漏洞在②：角平分线交 BC 于 D，但 D 一般<b>不是</b>中点 M。伪证明的图故意把 D 画在 M 的位置，于是后面的全等「恰好」成立。这就是几何伪证明的惯用伎俩：<b>图画得不对，推导全白搭</b>。"
  },
  {
    tag: "归纳法陷阱",
    question: "「所有马都是同一种颜色」？漏洞在哪？",
    story: "一个著名的归纳法伪证明。归纳法本身没问题，但这个证明里有个隐藏前提。<b>找出它第一次失效的地方</b>。",
    steps: [
      {lbl:"1", t:"基础：1 匹马当然和自己同色 ✓"},
      {lbl:"2", t:"假设任意 n 匹马都同色（归纳假设）"},
      {lbl:"3", t:"考虑 n+1 匹马：编号 1 到 n+1"},
      {lbl:"4", t:"前 n 匹（1~n）同色（用假设）"},
      {lbl:"5", t:"后 n 匹（2~n+1）同色（用假设）"},
      {lbl:"6", t:"两组的交集非空 → 全部同色！✗"}
    ],
    badStep: 5,
    hint: "从 n 推到 n+1 时，前 n 匹和后 n 匹一定有交集吗？",
    options: [
      "基础情况就错了",
      "归纳假设不允许这么用",
      "前 n 匹不一定同色",
      "当 n=1 时：前 1 匹是马1，后 1 匹是马2，交集是空的！"
    ],
    correct: 3,
    explain: "n=1 时，前 1 匹（马1）和后 1 匹（马2）<b>没有交集</b>，所以「两组同色 → 全部同色」的桥断了。归纳法要从小推到大，<b>每一步的桥都必须真的存在</b>——计算机验证归纳证明时，这种「桥断了」的情况会被精准抓出来。"
  },
  {
    tag: "推理现实",
    question: "AI 时代的侦探题：哪个推理是可靠的？",
    story: "你让 AI 帮你检查投资分析。它给出了四条「推理」，<b>只有一条是机器可验证的</b>。找出它。",
    steps: [
      {lbl:"1", t:"「经验告诉我，这家公司会涨」"},
      {lbl:"2", t:"「如果营收增长 20% 且利润率稳定，则 EPS 增长约 20%；现在两者都成立，所以 EPS 会增长」"},
      {lbl:"3", t:"「很多专家都说好，应该没问题」"},
      {lbl:"4", t:"「感觉最近市场情绪不错」"}
    ],
    badStep: -1,
    hint: "哪一条的每一步都能被机器检查？",
    options: [
      "经验直觉：无法验证",
      "条件推理：前提可查、结论可算，机器能验证",
      "专家意见：权威不等于证明",
      "市场情绪——主观感受"
    ],
    correct: 1,
    explain: "②是唯一可验证的：<b>「如果 A 且 B，则 C」</b>——A、B 可以从财报数据查到，C 可以重新算一遍。这就是形式化思维：把「我觉得」改写成「如果…则…」，机器就能帮你查漏。AI 时代，<b>能写出可验证推理的人，才是真正的侦探</b>。"
  }
];

/* ═══════════════ 游戏状态 ═══════════════ */
let idx = 0;
let solved = 0;

function renderProgress(){
  const p = document.getElementById('progress');
  p.innerHTML = '';
  CASES.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i < solved ? ' done' : '') + (i === idx ? ' active' : '');
    p.appendChild(d);
  });
}

function renderCase(){
  const c = CASES[idx];
  document.getElementById('caseNo').textContent = idx + 1;
  document.getElementById('caseTotal').textContent = CASES.length;
  document.getElementById('caseTag').textContent = c.tag;
  document.getElementById('question').textContent = c.question;
  document.getElementById('story').innerHTML = c.story;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('nextBtn').className = 'next';

  /* 黑板步骤 */
  const board = document.getElementById('board');
  board.innerHTML = '';
  c.steps.forEach((s, i) => {
    const line = document.createElement('div');
    line.className = 'step';
    line.innerHTML = `<span class="stepline"><span class="lbl">${s.lbl}</span>${s.t.replace(/\n/g, '<br>')}</span>`;
    if (i === c.badStep){ line.dataset.bad = '1'; line.innerHTML = line.innerHTML.replace('<span class="lbl">', '<span class="lbl">⚠️ '); }
    line.addEventListener('click', () => {
      if (line.dataset.found) return;
      if (i === c.badStep){
        line.classList.add('found');
        line.dataset.found = '1';
      } else {
        line.classList.add('hint-glow');
        setTimeout(() => line.classList.remove('hint-glow'), 600);
      }
    });
    board.appendChild(line);
  });

  /* 选项 */
  const opts = document.getElementById('options');
  opts.innerHTML = '';
  const letters = ['A','B','C','D'];
  c.options.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="letter">${letters[i]}</span>${t}`;
    btn.addEventListener('click', () => answer(i, btn));
    opts.appendChild(btn);
  });
}

function answer(choice, btn){
  const c = CASES[idx];
  const allBtns = document.querySelectorAll('.opt');
  allBtns.forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');
  if (choice === c.correct){
    btn.classList.add('correct');
    solved++;
    fb.className = 'feedback show good';
    fb.innerHTML = `✅ <b>答对了！</b> ${c.explain}`;
    /* 点亮漏洞步骤 */
    if (c.badStep >= 0){
      const steps = document.querySelectorAll('.board .step');
      steps[c.badStep].classList.add('found');
    }
  } else {
    btn.classList.add('wrong');
    fb.className = 'feedback show bad';
    fb.innerHTML = `❌ 再想想。${c.hint}`;
    allBtns.forEach(b => b.disabled = false);
    return;
  }
  renderProgress();
  const next = document.getElementById('nextBtn');
  next.className = 'next ready';
  next.onclick = () => {
    idx++;
    if (idx < CASES.length){ renderCase(); renderProgress(); }
    else {
      document.getElementById('case').style.display = 'none';
      document.getElementById('finale').className = 'finale show';
      renderProgress();
    }
  };
}

renderProgress();
renderCase();
</script>
</body>
</html>
